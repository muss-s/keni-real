<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get Keni</title>
<meta name="description" content="Find your next favorite spot in Angeles, and plan it with your tropa. Free, no app store.">
<meta property="og:title" content="Get Keni ✦">
<meta property="og:description" content="Find your next favorite spot in Angeles, and plan it with your tropa. Free, no app store.">
<meta property="og:image" content="https://keni-real.vercel.app/icons/icon-512.png">
<meta property="og:url" content="https://keni-real.vercel.app/get">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#06060b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keni">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Bricolage+Grotesque:opsz,wght@12..96,700..800&display=swap" rel="stylesheet">
<style>
/* Keni · Get Keni — the link people share so friends can put Keni on their home screen (keni-real.vercel.app/get) */
:root { --bg: #06060b; --ink: #f6f1ff; --ink-2: rgba(246, 241, 255, .74); --ink-3: rgba(246, 241, 255, .5); --line: rgba(255, 255, 255, .12); --spring: cubic-bezier(.34, 1.56, .64, 1); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: 'Geist', 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; display: grid; place-items: center; padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 120px); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: -20% -20% auto; height: 70vh; background: radial-gradient(ellipse at 30% 30%, rgba(139, 108, 255, .38), transparent 60%), radial-gradient(ellipse at 75% 20%, rgba(255, 143, 200, .26), transparent 55%); filter: blur(10px); pointer-events: none; animation: glow 9s ease-in-out infinite alternate; }
@keyframes glow { to { transform: translate(4%, 6%) scale(1.08); } }
main { position: relative; width: 100%; max-width: 420px; display: grid; justify-items: center; text-align: center; gap: 14px; }
.logo { width: 190px; margin-bottom: 4px; }
.logo path.l { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s cubic-bezier(.6, 0, .2, 1) forwards; animation-delay: calc(var(--i) * .14s); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.logo .pin { transform-box: fill-box; transform-origin: 50% 100%; animation: drop .7s var(--spring) .7s both; }
@keyframes drop { from { transform: translateY(-40px) scale(.6); opacity: 0; } }
h1 { margin: 0; font: 800 clamp(2rem, 9vw, 2.6rem)/1.05 'Bricolage Grotesque', sans-serif; letter-spacing: -.03em; }
h1 em { font-style: normal; background: linear-gradient(120deg, #c4b0ff, #ff8fc8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { margin: 0; max-width: 32ch; color: var(--ink-2); line-height: 1.5; }
.from { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 99px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); font-size: .88rem; color: var(--ink-2); }
.from[hidden] { display: none; }
.from i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; background: linear-gradient(145deg, #a88cff, #ff8fc8); color: #170f2c; font-weight: 800; font-size: .8rem; }
.card { width: 100%; margin-top: 10px; padding: 18px; border-radius: 26px; background: linear-gradient(160deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .03)); border: 1px solid rgba(196, 176, 255, .2); box-shadow: 0 30px 60px -30px #000, inset 0 1px 0 rgba(255, 255, 255, .07); display: grid; gap: 12px; text-align: left; animation: up .6s var(--spring) .3s both; }
@keyframes up { from { opacity: 0; transform: translateY(24px) scale(.97); } }
.card h2 { margin: 0; font: 700 1.05rem 'Geist', sans-serif; }
ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
li { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: rgba(255, 255, 255, .05); line-height: 1.35; animation: up .5s var(--spring) both; animation-delay: calc(.45s + var(--i) * .12s); }
li .n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .85rem; color: #170f2c; background: linear-gradient(145deg, #c4b0ff, #ff8fc8); }
li svg { width: 22px; height: 22px; vertical-align: -5px; color: #4da3ff; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; padding: 0 20px; border: 0; border-radius: 99px; font: 700 1.05rem 'Geist', sans-serif; text-decoration: none; cursor: pointer; transition: transform .25s var(--spring); }
.btn:active { transform: scale(.96); }
.btn.primary { color: #170f2c; background: linear-gradient(135deg, #fff, #e3d9ff 55%, #ffc6e4); box-shadow: 0 14px 34px -12px rgba(196, 140, 255, .9); }
.btn.ghost { color: var(--ink); background: rgba(255, 255, 255, .08); border: 1px solid var(--line); }
.btn svg { width: 20px; height: 20px; }
.alt { margin-top: 4px; color: var(--ink-3); font-size: .9rem; }
.alt a { color: var(--ink-2); }
.qr { padding: 14px; border-radius: 20px; background: #fff; line-height: 0; justify-self: center; }
.qr svg { width: 200px; height: 200px; }
/* iPhone Safari: an arrow down to the Share button in the bar */
.arrow { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 14px); translate: -50% 0; display: grid; justify-items: center; gap: 2px; color: #ff8fc8; font-weight: 700; font-size: .8rem; animation: bob 1.3s ease-in-out infinite; pointer-events: none; }
.arrow[hidden] { display: none; }
.arrow.right { left: auto; right: 6px; translate: 0 0; }
.arrow svg { width: 34px; height: 34px; filter: drop-shadow(0 0 12px rgba(255, 143, 200, .8)); }
@keyframes bob { 50% { transform: translateY(8px); } }
.done { font-size: 3rem; animation: up .6s var(--spring) both; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } .logo path.l { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="-12 -64 184 118" role="img" aria-label="keni">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#ff8fc8"/></linearGradient></defs>
    <g fill="none" stroke="#f6f1ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path class="l" pathLength="1" style="--i:0" d="M0 -24V40M2 24 24 2M11 15 27 40"/><path class="l" pathLength="1" style="--i:1" d="M42 20H82A20 20 0 1 0 76.1 34.1"/>
      <path class="l" pathLength="1" style="--i:2" d="M98 40V0M98 18A18 18 0 0 1 134 18V40"/><path class="l" pathLength="1" style="--i:3" d="M152 5V40"/></g>
    <path class="pin" fill-rule="evenodd" fill="url(#g)" d="M152 -5C147 -12 142 -17 142 -24A10 10 0 1 1 162 -24C162 -17 157 -12 152 -5ZM152 -27.6A3.6 3.6 0 1 0 152 -20.4A3.6 3.6 0 1 0 152 -27.6Z"/>
  </svg>
  <span class="from" id="from" hidden><i id="from-i"></i><span id="from-t"></span></span>
  <h1>Your tropa’s on <em>Keni</em></h1>
  <p class="sub">Find your next favorite spot in Angeles, and plan it with your tropa. Free, no app store.</p>
  <section class="card" id="card" aria-live="polite"></section>
  <p class="alt" id="alt"><a href="/">Or just open Keni in your browser →</a></p>
</main>
<div class="arrow" id="arrow" hidden><span>Share is down here</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M6 13l6 6 6-6"/></svg></div>
<script>
(() => {
  const ua = navigator.userAgent, $ = (s) => document.querySelector(s);
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);
  const inApp = /FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|MicroMessenger|TikTok|musical_ly/.test(ua);
  const iosSafari = ios && !inApp && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  const iosV = +((/OS (\d+)_/.exec(ua) || /Version\/(\d+)/.exec(ua) || [])[1] || 0), newSafari = iosV >= 26; // Safari 26 keeps Share inside the ⋯ menu
  const installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const app = location.origin + '/';
  const SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>';
  const ADD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>';
  const card = $('#card');
  const step = (i, html) => '<li style="--i:' + i + '"><span class="n">' + (i + 1) + '</span><span>' + html + '</span></li>';

  // who shared it: /get?from=Name (optional)
  const from = (new URLSearchParams(location.search).get('from') || '').replace(/[<>&"]/g, '').trim().slice(0, 24);
  if (from) { $('#from').hidden = false; $('#from-i').textContent = from[0].toUpperCase(); $('#from-t').textContent = from + ' invited you'; }

  if (installed) { location.replace(app); return; } // already the app: go straight in
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

  let deferred = null;
  function draw() {
    if (inApp) {
      // inside Messenger / Instagram: apps can't be added from here, so hop to the real browser first
      const intent = 'intent://' + location.host + '/get' + location.search + '#Intent;scheme=https;package=com.android.chrome;end';
      card.innerHTML = '<h2>First, open this in ' + (ios ? 'Safari' : 'Chrome') + '</h2>'
        + '<ol>' + step(0, 'Tap <b>⋯</b> at the top of this screen') + step(1, 'Tap <b>Open in ' + (ios ? 'Safari' : 'browser') + '</b>') + '</ol>'
        + (android ? '<a class="btn primary" href="' + intent + '">Open in Chrome</a>' : ios ? '<a class="btn primary" href="x-safari-https://' + location.host + '/get' + location.search + '">Open in Safari</a>' : '')
        + '<button class="btn ghost" data-a="copy">Copy the link</button>';
      return;
    }
    if (ios) {
      if (!iosSafari) { card.innerHTML = '<h2>Open this in Safari</h2><ol>' + step(0, 'iPhones only add apps from <b>Safari</b>') + step(1, 'Copy the link and paste it in Safari') + '</ol><button class="btn primary" data-a="copy">Copy the link</button>'; return; }
      // so the home screen icon opens the app itself, not this page
      try { history.replaceState(null, '', '/'); } catch { /* fine */ }
      card.innerHTML = '<h2>Add Keni to your home screen</h2><ol>'
        + (newSafari ? step(0, 'Tap <b>⋯</b> at the bottom right, then <b>Share</b> ' + SHARE) : step(0, 'Tap Share ' + SHARE + ' at the bottom of Safari'))
        + step(1, 'Scroll down and tap <b>Add to Home Screen</b> ' + ADD)
        + step(2, 'Tap <b>Add</b>. Then open Keni from your home screen') + '</ol>';
      $('#arrow').hidden = false; if (newSafari) { $('#arrow').classList.add('right'); $('#arrow span').textContent = 'Tap ⋯ down here'; }
      return;
    }
    if (deferred) {
      card.innerHTML = '<h2>Put Keni on your home screen</h2><button class="btn primary" data-a="install">' + ADD + ' Install Keni</button><p class="alt" style="margin:0;text-align:center">One tap. It opens full screen, like any app.</p>';
      return;
    }
    if (android) {
      card.innerHTML = '<h2>Add Keni to your home screen</h2><ol>' + step(0, 'Tap your browser’s menu <b>⋮</b>') + step(1, 'Tap <b>Install app</b> or <b>Add to Home screen</b>') + '</ol>';
      return;
    }
    // a computer: scan to get it on your phone
    card.innerHTML = '<h2>Get it on your phone</h2><p class="alt" style="margin:0">Scan this with your phone’s camera.</p><div class="qr" id="qr"></div><a class="btn primary" href="/">Open Keni here</a>';
    $('#alt').hidden = true;
    const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
    s.onload = () => { const q = window.qrcode(0, 'M'); q.addData(location.origin + '/get' + location.search); q.make(); $('#qr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); };
    document.head.appendChild(s);
  }
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; draw(); });
  window.addEventListener('appinstalled', () => {
    card.innerHTML = '<div class="done" style="text-align:center">🎉</div><h2 style="text-align:center">Keni is on your home screen</h2><a class="btn primary" href="/">Open Keni</a>';
  });
  card.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    if (b.dataset.a === 'copy') { const url = location.origin + '/get' + location.search; try { await navigator.clipboard.writeText(url); b.textContent = 'Copied ✓'; } catch { prompt('Copy this link', url); } }
    if (b.dataset.a === 'install' && deferred) { const d = deferred; deferred = null; d.prompt(); try { await d.userChoice; } catch { /* closed */ } draw(); }
  });
  draw();
})();
</script>
</body>
</html>
